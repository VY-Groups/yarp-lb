name: ADC external VIP fencing provider contracts
on:
  pull_request:
    paths: ["control-center/**", "tests/FleetQuorumAcceptance/**", "ops/ha/**", ".github/workflows/adc-vip-fence-provider.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet run --project tests/FleetQuorumAcceptance/FleetQuorumAcceptance.csproj -c Release -- --vip-fence-contract
      - name: Check Linux offline service installer syntax and plan
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash -n ops/ha/install-vip-service.sh
          d=$(mktemp -d)
          touch "$d/config.json"
          bash ops/ha/install-vip-service.sh agent /usr/bin/true "$d/config.json" root | grep 'PLAN ONLY'
      - name: Check Windows offline service installer syntax and plan
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $config = Join-Path $env:RUNNER_TEMP 'vip-agent-plan.json'
          Set-Content -LiteralPath $config -Value '{}'
          $plan = & ./ops/ha/Install-VipService.ps1 -Role agent -Executable "$env:SystemRoot\System32\whoami.exe" -Config $config
          if ($plan.Name -ne 'GatewayCoreVipNodeAgent' -or $plan.Applied) { throw 'Unexpected offline installation plan' }
      - name: Real disposable Linux systemd role registration
        if: runner.os == 'Linux'
        shell: bash
        run: sudo -n env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" bash ops/ha/test-vip-service-install.sh
      - name: Real disposable Windows SCM role registration
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./ops/ha/Test-VipServiceInstall.ps1
      - name: Build shipping node-agent executable
        run: dotnet build control-center/GatewayCoreYarp.csproj -c Release
      - name: Installed Linux agent runtime and protected credential acceptance
        if: runner.os == 'Linux'
        shell: bash
        run: sudo -n env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" DOTNET_ROOT="$DOTNET_ROOT" "$(command -v python3)" ops/ha/test-vip-agent-runtime.py "$PWD/control-center/bin/Release/net10.0/GatewayCoreYarp"
      - name: Installed Windows agent runtime and protected credential acceptance
        if: runner.os == 'Windows'
        shell: pwsh
        run: python ops/ha/test-vip-agent-runtime.py "$PWD/control-center/bin/Release/net10.0/GatewayCoreYarp.exe"
