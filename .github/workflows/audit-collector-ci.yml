name: Independent audit collector HTTPS acceptance
on:
  push:
    branches: [main]
    paths: ["engines/AuditCollector/**", "tests/AuditCollector/**", "control-center/**", "tests/E2E/real_control_center.py", ".github/workflows/audit-collector-ci.yml"]
  pull_request:
    paths: ["engines/AuditCollector/**", "tests/AuditCollector/**", "control-center/**", "tests/E2E/real_control_center.py", ".github/workflows/audit-collector-ci.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collector:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build engines/AuditCollector/AuditCollector.csproj -c Release
      - name: Verify durable retention journal and SDK contract
        run: dotnet run --project tests/AuditCollector/RetentionTests.csproj -c Release
      - name: Build shipping gateway for real receipt acceptance
        if: runner.os == 'Linux'
        run: dotnet build control-center/GatewayCoreYarp.csproj -c Release
      - name: Real TLS receiver, signed chain, restart, replay and gateway account receipts
        if: runner.os == 'Linux'
        run: python3 tests/AuditCollector/acceptance.py engines/AuditCollector/bin/Release/net10.0/AuditCollector.dll
