# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
#
# ******** NOTE ********
# We have attempted to detect the languages in your repository. Please check
# the `language` matrix defined below to confirm you have the correct set of
# supported CodeQL languages.
#
name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '15 20 * * 6'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Runner size impacts CodeQL analysis time. To learn more, please see:
    #   - https://gh.io/recommended-hardware-resources-for-running-codeql
    #   - https://gh.io/supported-runners-and-hardware-resources
    #   - https://gh.io/using-larger-runners (GitHub.com only)
    # Consider using larger runners or machines with greater resources for possible analysis time improvements.
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    permissions:
      # required for all workflows
      security-events: write

      # required to fetch internal or private CodeQL packs
      packages: read

      # only required for workflows in private repositories
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: actions
          build-mode: none
        - language: csharp
          build-mode: none
        - language: javascript-typescript
          build-mode: none
        - language: python
          build-mode: none
        # CodeQL supports the following values keywords for 'language': 'actions', 'c-cpp', 'csharp', 'go', 'java-kotlin', 'javascript-typescript', 'python', 'ruby', 'rust', 'swift'
        # Use `c-cpp` to analyze code written in C, C++ or both
        # Use 'java-kotlin' to analyze code written in Java, Kotlin or both
        # Use 'javascript-typescript' to analyze code written in JavaScript, TypeScript or both
        # To learn more about changing the languages that are analyzed or customizing the build mode for your analysis,
        # see https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/customizing-your-advanced-setup-for-code-scanning.
        # If you are analyzing a compiled language, you can modify the 'build-mode' for that language to customize how
        # your codebase is analyzed, see https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/codeql-code-scanning-for-compiled-languages
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    # Add any setup steps before running the `github/codeql-action/init` action.
    # This includes steps like installing compilers or runtimes (`actions/setup-node`
    # or others). This is typically only required for manual builds.
    # - name: Setup runtime (example)
    #   uses: actions/setup-example@v1

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        # If you wish to specify custom queries, you can do so here or in a config file.
        # By default, queries listed here will override any specified in a config file.
        # Prefix the list here with "+" to use these queries and those in the config file.

        # For more details on CodeQL's query packs, refer to: https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/configuring-code-scanning#using-queries-in-ql-packs
        # queries: security-extended,security-and-quality

    # If the analyze step fails for one of the languages you are analyzing with
    # "We were unable to automatically build your code", modify the matrix above
    # to set the build mode to "manual" for that language. Then modify this step
    # to build your code.
    # ℹ️ Command-line programs to run using the OS shell.
    # 📚 See https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#jobsjob_idstepsrun
    - name: Run manual build steps
      if: matrix.build-mode == 'manual'
      shell: bash
      run: |
        echo 'If you are using a "manual" build mode for one or more of the' \
          'languages you are analyzing, replace this with the commands to build' \
          'your code, for example:'
        echo '  make bootstrap'
        echo '  make release'
        exit 1

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"
        output: ${{ runner.temp }}/gatewaycore-codeql-results

    # A successful analysis job is not evidence of zero findings. Retain a
    # minimal inventory without source snippets, data-flow traces or messages.
    - name: Record CodeQL findings inventory
      shell: bash
      env:
        SARIF_DIRECTORY: ${{ runner.temp }}/gatewaycore-codeql-results
        INVENTORY_DIRECTORY: ${{ runner.temp }}/gatewaycore-codeql-inventory
        SCAN_LANGUAGE: ${{ matrix.language }}
      run: |
        python3 - <<'PY'
        import collections
        import json
        import os
        from pathlib import Path

        files = sorted(Path(os.environ["SARIF_DIRECTORY"]).rglob("*.sarif"))
        if not files:
            raise SystemExit("CodeQL inventory: no SARIF output")
        counts = collections.Counter()
        locations = []
        run_count = 0
        for file in files:
            document = json.loads(file.read_text(encoding="utf-8"))
            if document.get("version") != "2.1.0" or not document.get("runs"):
                raise SystemExit("CodeQL inventory: invalid SARIF output")
            for run in document["runs"]:
                run_count += 1
                results = run.get("results", [])
                if not isinstance(results, list):
                    raise SystemExit("CodeQL inventory: invalid results")
                for result in results:
                    rule = result.get("ruleId") or "(unknown rule)"
                    counts[rule] += 1
                    for location in result.get("locations", [])[:5]:
                        physical = location.get("physicalLocation", {})
                        artifact = physical.get("artifactLocation", {})
                        uri = artifact.get("uri", "")
                        region = physical.get("region", {})
                        # Retain only repository-relative source locations; no snippets,
                        # messages, absolute paths or untrusted workflow log commands.
                        if (isinstance(uri, str) and uri and not uri.startswith("/")
                            and ":" not in uri and "\\" not in uri
                            and ".." not in uri.split("/") and all(
                                ch.isascii() and (ch.isalnum() or ch in "/._-") for ch in uri)):
                            locations.append({"rule": rule, "path": uri,
                                              "line": region.get("startLine")})
        inventory = {
            "commit": os.environ["GITHUB_SHA"],
            "ref": os.environ["GITHUB_REF"],
            "run_id": os.environ["GITHUB_RUN_ID"],
            "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
            "language": os.environ["SCAN_LANGUAGE"],
            "sarif_runs": run_count,
            "observed_results": sum(counts.values()),
            "by_rule": dict(sorted(counts.items())),
            "locations": locations,
            "scope": "Raw SARIF result counts, not GitHub alert closure status",
        }
        destination = Path(os.environ["INVENTORY_DIRECTORY"])
        destination.mkdir(parents=True, exist_ok=True)
        (destination / "findings.json").write_text(
            json.dumps(inventory, indent=2) + "\n", encoding="utf-8")
        with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
            summary.write("## CodeQL findings inventory\n\n")
            summary.write(f"Analyzed commit: `{inventory['commit']}`\n\n")
            summary.write(f"Raw results: **{inventory['observed_results']}**\n\n")
            summary.write("See the findings inventory artifact for counts by rule. ")
            summary.write("These counts are not GitHub alert closure status.\n")
        PY

    - name: Upload CodeQL findings inventory
      uses: actions/upload-artifact@v4
      with:
        name: codeql-findings-${{ matrix.language }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/gatewaycore-codeql-inventory/findings.json
        if-no-files-found: error
        retention-days: 14

