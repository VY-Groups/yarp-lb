# CI evidence-only verification after merging PR #31 and PR #32; no behavior or thresholds changed.
name: Control Center 0.1 - complete application source checks

on:
  push:
    branches: [main, "ci/**", "feature/**"]
    paths:
      - "control-center/**"
      - "ops/acceptance/**"
      - "ops/fleet/linux_dp_real_restore_e2e.py"
      - "ops/fleet/linux_dp_receive_restore.py"
      - "ops/fleet/linux_dp_restore_watchdog.py"
      - "ops/fleet/test_linux_dp_restore_watchdog.py"
      - "ops/fleet/linux_dp_mtls_transport.py"
      - "tests/CI/branding/**"
      - ".github/workflows/control-center-ci.yml"
      - "tests/E2E/peer_delta_http.py"
      - "tests/E2E/real_control_center.py"
  pull_request:
    paths:
      - "control-center/**"
      - "ops/acceptance/**"
      - "ops/fleet/linux_dp_real_restore_e2e.py"
      - "ops/fleet/linux_dp_receive_restore.py"
      - "ops/fleet/linux_dp_restore_watchdog.py"
      - "ops/fleet/test_linux_dp_restore_watchdog.py"
      - "ops/fleet/linux_dp_mtls_transport.py"
      - "tests/CI/branding/**"
      - ".github/workflows/control-center-ci.yml"
      - "tests/E2E/peer_delta_http.py"
      - "tests/E2E/real_control_center.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-app-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-application:
    name: Full application build - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    defaults:
      run:
        working-directory: control-center
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build complete ASP.NET Core control plane
        run: dotnet build GatewayCoreYarp.csproj --configuration Release
      - name: Build separate gateway agent
        run: dotnet build GatewayAgent/GatewayCoreGatewayAgent.csproj --configuration Release
      - name: Test read-only GitOps route and cluster plan
        run: dotnet run --project tests/GatewayConfigPlanTests/GatewayConfigPlanTests.csproj --configuration Release
      - name: Run load balancing core tests
        run: dotnet run --project tests/LoadBalancingCoreTests/LoadBalancingCoreTests.csproj --configuration Release
      - name: Verify actual Control Center console cannot block gateway request threads
        run: dotnet run --project tests/NonBlockingConsoleLoggerTests/NonBlockingConsoleLoggerTests.csproj --configuration Release
      - name: Verify signed fleet configuration acceptance
        run: dotnet run --project tests/FleetConfigSignatureTests/FleetConfigSignatureTests.csproj --configuration Release
      - name: Verify signed independent engine config contracts
        run: dotnet run --project tests/EngineConfigSecurityTests/EngineConfigSecurityTests.csproj --configuration Release
      - name: Test backend mTLS certificate contract
        run: dotnet run --project tests/BackendMtlsTests/BackendMtlsTests.csproj --configuration Release
      - name: Verify Linux production Data Protection RSA encryption and rotation
        if: runner.os == 'Linux'
        run: dotnet run --project tests/LinuxKeyProtectionTests/LinuxKeyProtectionTests.csproj --configuration Release
      - name: Real two-process Linux fleet key rotation and lost-key recovery
        if: runner.os == 'Linux'
        env:
          GITHUB_ACTIONS: "true"
          RUNNER_OS: "Linux"
        shell: bash
        run: |
          set -euo pipefail
          export GATEWAYCORE_PRODUCT_DLL="$PWD/bin/Release/net10.0/GatewayCoreYarp.dll"
          export GATEWAYCORE_PRODUCT_WORKDIR="$PWD"
          dotnet run --project tests/LinuxFleetRollingRecoveryTests/LinuxFleetRollingRecoveryTests.csproj --configuration Release
      - name: Reject unsafe legacy-state cutover without modifying users or keys
        run: dotnet run --project tests/LegacyStateGuardTests/LegacyStateGuardTests.csproj --configuration Release
      - name: Verify real Control Center EC2 CI-only TLS safety and allowlist
        run: dotnet run --project tests/Ec2LabSafetyTests/Ec2LabSafetyTests.csproj --configuration Release
      - name: Offline functional smoke of the real Control Center and two local backends
        run: python ../tests/EC2Functional/smoke.py --root . --dll bin/Release/net10.0/GatewayCoreYarp.dll
      - name: Real HTTPS peer v4 delta, gap recovery and receiver restart
        if: runner.os == 'Linux'
        env:
          CI: "true"
        run: python ../tests/E2E/peer_delta_http.py --root .
      - name: Verify EC2 request caps and read-only harness without network access
        run: python -m unittest discover -s ../tests/EC2Functional -p 'test_*.py' -v
      - name: Install Microsoft MsQuic for mandatory Linux HTTP/3 acceptance
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # Disposable GitHub runner images may advertise unreachable regional
          # HTTP mirrors ahead of a working official Ubuntu HTTPS archive.
          # Prefer the already-configured official archive, retaining Ubuntu
          # signature checks and the mandatory HTTP/3 integration assertions.
          # Never edit production host repositories or accept unsigned APT data.
          if [[ -f /etc/apt/apt-mirrors.txt ]] &&
             grep -Eq '^https://archive[.]ubuntu[.]com/ubuntu/?' /etc/apt/apt-mirrors.txt; then
            # Azure and AWS regional HTTP mirrors can be unreachable while
            # the official HTTPS fallback is healthy. Remove ONLY the
            # regional/default Ubuntu HTTP archive entries from this runner.
            sudo sed -i -E '/^http:\/\/([[:alnum:].-]+\.)?archive\.ubuntu\.com\/ubuntu\/?/d' \
              /etc/apt/apt-mirrors.txt
          fi
          # Fail loudly on an unresponsive package mirror rather than
          # silently consuming the entire 25-minute application-test job.
          # HTTP/3 acceptance below remains mandatory; no skip or fallback.
          if ! apt-cache show libmsquic >/dev/null 2>&1; then
            curl --fail --silent --show-error --location --retry 2 \
              --connect-timeout 10 --max-time 60 \
              https://packages.microsoft.com/config/ubuntu/24.04/packages-microsoft-prod.deb \
              --output "$RUNNER_TEMP/packages-microsoft-prod.deb"
            timeout 60s sudo dpkg -i "$RUNNER_TEMP/packages-microsoft-prod.deb"
          fi
          timeout 120s sudo apt-get update \
            -o Acquire::Retries=1 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 \
            -o DPkg::Lock::Timeout=30
          timeout 120s sudo env DEBIAN_FRONTEND=noninteractive apt-get install --yes libmsquic \
            -o Acquire::Retries=1 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 \
            -o DPkg::Lock::Timeout=30
      - name: Test TLS inventory and exact HTTP/2 and HTTP/3 gRPC transport
        env:
          GATEWAYCORE_REQUIRE_HTTP3_ACCEPTANCE: ${{ runner.os == 'Linux' && '1' || '0' }}
        run: dotnet run --project tests/TlsInventoryTests/TlsInventoryTests.csproj --configuration Release
      - name: Check frontend compile reproducibility
        shell: bash
        run: |
          npx --yes --package typescript@5.9.3 tsc --project wwwroot/tsconfig.json
          git diff --exit-code -- wwwroot/app.js
      - name: Run frontend UI regression tests
        run: node --test tests/test_onboarding_ui.mjs tests/test_setup_ui.mjs tests/test_auth_ui.mjs tests/test_five_screens.mjs tests/test_ui_shell_contract.mjs tests/test_session_isolation_ui.mjs tests/test_readiness_ui.mjs
      - name: Verify repository-wide neutral branding and build target paths
        working-directory: .
        run: python -m unittest discover -s tests/CI/branding -p 'test_*.py' -v
      - name: Run backend source contract checks
        shell: bash
        run: |
          python tests/test_release_contracts.py
          python tests/test_traffic_contracts.py
          python tests/test_universal_contracts.py
          python tests/validate_package.py
# CI-only revalidation for merged PR31 and PR32: no change to tests or thresholds.
