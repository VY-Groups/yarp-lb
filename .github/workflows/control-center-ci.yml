name: Control Center 0.1 - complete application source checks

on:
  push:
    branches: [main, "ci/**", "feature/**"]
    paths:
      - "control-center/**"
      - ".github/workflows/control-center-ci.yml"
  pull_request:
    paths:
      - "control-center/**"
      - ".github/workflows/control-center-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-app-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-application:
    name: Full application build - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    defaults:
      run:
        working-directory: control-center
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build complete ASP.NET Core control plane
        run: dotnet build SpeedSignYarp.csproj --configuration Release
      - name: Build separate gateway agent
        run: dotnet build GatewayAgent/SpeedSignGatewayAgent.csproj --configuration Release
      - name: Run load balancing core tests
        run: dotnet run --project tests/LoadBalancingCoreTests/LoadBalancingCoreTests.csproj --configuration Release
      - name: Verify actual Control Center console cannot block gateway request threads
        run: dotnet run --project tests/NonBlockingConsoleLoggerTests/NonBlockingConsoleLoggerTests.csproj --configuration Release
      - name: Verify signed fleet configuration acceptance
        run: dotnet run --project tests/FleetConfigSignatureTests/FleetConfigSignatureTests.csproj --configuration Release
      - name: Verify signed independent engine config contracts
        run: dotnet run --project tests/EngineConfigSecurityTests/EngineConfigSecurityTests.csproj --configuration Release
      - name: Test backend mTLS certificate contract
        run: dotnet run --project tests/BackendMtlsTests/BackendMtlsTests.csproj --configuration Release
      - name: Test TLS certificate inventory status logic
        run: dotnet run --project tests/TlsInventoryTests/TlsInventoryTests.csproj --configuration Release
      - name: Check frontend compile reproducibility
        shell: bash
        run: |
          npx --yes --package typescript@5.9.3 tsc --project wwwroot/tsconfig.json
          git diff --exit-code -- wwwroot/app.js
      - name: Run frontend UI regression tests
        run: node --test tests/test_onboarding_ui.mjs tests/test_setup_ui.mjs
      - name: Run backend source contract checks
        shell: bash
        run: |
          python tests/test_release_contracts.py
          python tests/test_traffic_contracts.py
          python tests/test_universal_contracts.py
          python tests/validate_package.py
