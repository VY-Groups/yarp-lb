name: Real Control Center E2E - browser and API
on:
  pull_request:
    paths:
      - "control-center/**"
      - "tests/E2E/**"
      - ".github/workflows/e2e-real-control-center.yml"
  push:
    branches: [main]
    paths:
      - "control-center/**"
      - "tests/E2E/**"
      - ".github/workflows/e2e-real-control-center.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: real-control-center-e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  authenticated-api:
    name: Real .NET API + protected state + two-person approval
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build shipping production-mode Control Center
        run: dotnet build control-center/GatewayCoreYarp.csproj --configuration Release
      - name: Execute REAL HTTP backend flow against isolated local .NET process
        run: python tests/E2E/real_control_center.py --root control-center

  real-chromium:
    name: Real Chromium GUI + live Kestrel API (no mocks)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build shipping production-mode Control Center
        run: dotnet build control-center/GatewayCoreYarp.csproj --configuration Release
      - name: Install pinned Playwright test package
        run: npm install --prefix tests/E2E --no-package-lock --ignore-scripts
      - name: Install real Chromium with OS dependencies
        working-directory: tests/E2E
        shell: bash
        run: |
          set -euo pipefail
          # Runner image provisioning can still be finishing APT work when this
          # job starts. Wait for the package manager instead of racing its lock.
          wait_for_package_manager() {
            local deadline=$((SECONDS + 300))
            while pgrep -x apt-get >/dev/null || pgrep -x apt >/dev/null || \
                  pgrep -x dpkg >/dev/null || pgrep -f '[u]nattended-upgrade' >/dev/null; do
              if (( SECONDS >= deadline )); then
                echo "::error::Timed out waiting for the runner's APT/dpkg operation to finish"
                ps -eo pid,comm,args | grep -E 'apt|dpkg|unattended-upgrade' || true
                return 1
              fi
              echo "::notice::Runner package manager is busy; waiting for its lock"
              sleep 5
            done
          }
          # Bound retries of transient Ubuntu mirror and browser CDN failures.
          # Keep Playwright's full dependency installation and signed APT indexes.
          sudo tee /etc/apt/apt.conf.d/99-gatewaycore-ci-retry >/dev/null <<'EOF'
          Acquire::Retries "2";
          Acquire::http::Timeout "15";
          Acquire::https::Timeout "15";
          APT::Update::Error-Mode "any";
          EOF
          for attempt in 1 2 3; do
            wait_for_package_manager
            if timeout --kill-after=15s 240s npx playwright install --with-deps chromium; then
              exit 0
            fi
            echo "::warning::Chromium dependency installation attempt ${attempt}/3 failed"
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep "$((attempt * 10))"
          done
      - name: Browser acceptance on real localhost GatewayCore Kestrel
        run: cd tests/E2E && npm test
      - name: Keep screenshots, traces and browser reports for failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-chromium-e2e-evidence
          path: tests/E2E/test-results/
          retention-days: 7
          if-no-files-found: ignore

