name: Temporary EC2 cross-region GSLB acceptance
on:
  pull_request:
    branches: [main]
    paths: [".github/workflows/ec2-cross-region-acceptance.yml"]
permissions: {}
jobs:
  test:
    if: github.head_ref == 'codex/ec2-cross-region-acceptance'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify both origins and both authoritative DNS processes
        env:
          TEST_KEY: ${{ secrets.EC2_GC_TEST_87323 }}
        shell: bash
        run: |
          set -eu
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$TEST_KEY" > ~/.ssh/id_ed25519
          unset TEST_KEY
          cat > ~/.ssh/known_hosts <<'HOSTS'
          15.252.99.51 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGQ97ugAw9W3k0V2cXp1/vcQMj/NmMd3D3r+RUOq21nJ
          15.152.85.231 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJyf0HehH6+kSAn8e8BKPO+IImCf/nh5xIXdWeE44VNy
          HOSTS
          python - <<'PY'
          import concurrent.futures, subprocess, time, urllib.request
          hosts = ["15.252.99.51","15.152.85.231"]
          def call(host, cmd):
              return subprocess.check_output(["ssh","-o","BatchMode=yes","-o","ConnectTimeout=5","-o","StrictHostKeyChecking=yes","ec2-user@"+host,cmd], timeout=9,text=True).strip()
          def expect(answer, nodes=hosts):
              start=time.monotonic()
              while time.monotonic()-start < 20:
                  with concurrent.futures.ThreadPoolExecutor() as pool:
                      observed=list(pool.map(lambda h: call(h,"query"),nodes))
                  if observed == [answer]*len(nodes):
                      print("DNS",nodes,answer,"observed after",round(time.monotonic()-start,2),"seconds",flush=True)
                      if answer != "SERVFAIL":
                          with urllib.request.urlopen("http://"+answer+"/gc-87323-test/ready",timeout=4) as resp:
                              assert resp.read().strip()==b"ready"
                      return
              raise RuntimeError((answer,observed))
          try:
              expect(hosts[0])
              call(hosts[0],"withdraw")
              expect(hosts[1])
              call(hosts[1],"withdraw")
              expect("SERVFAIL")
              call(hosts[1],"restore")
              expect(hosts[1])
              call(hosts[0],"restore")
              expect(hosts[0])
              for i, host in enumerate(hosts):
                  call(host,"pause")
                  expect(hosts[0],[hosts[1-i]])
                  call(host,"resume")
                  expect(hosts[0])
              import json
              def l7(expected, nodes=hosts):
                  until=time.monotonic()+15
                  while time.monotonic()<until:
                      with concurrent.futures.ThreadPoolExecutor() as pool:
                          actual=list(pool.map(lambda h: call(h,"l7"),nodes))
                      if actual==[expected]*len(nodes):
                          print("YARP",nodes,actual,flush=True)
                          return
                  raise RuntimeError((expected,actual))
              l7("200:mumbai")
              with concurrent.futures.ThreadPoolExecutor() as pool:
                  streams = [pool.submit(subprocess.check_output, ["ssh","-o","BatchMode=yes","ec2-user@"+h,"traffic"],text=True,timeout=150) for h in hosts]
                  call(hosts[0],"withdraw")
                  l7("200:osaka")
                  call(hosts[0],"restore")
                  l7("200:mumbai")
                  for h,future in zip(hosts,streams):
                      metrics=json.loads(future.result())
                      print("YARP request sample",h,metrics,flush=True)
                      assert metrics["requests"]==90 and sum(metrics["counts"].get("200:"+city,0) for city in ["mumbai","osaka"])==90
              for h in hosts:
                  call(h,"withdraw")
              l7("503")
              call(hosts[1],"restore")
              l7("200:osaka")
              call(hosts[0],"restore")
              l7("200:mumbai")
              for i,h in enumerate(hosts):
                  call(h,"pause-l7")
                  l7("200:mumbai",[hosts[1-i]])
                  call(h,"resume-l7")
                  l7("200:mumbai")
              # Two-address retries are confined to idempotent GETs.
              import collections, math
              def fetch(h):
                  with urllib.request.urlopen("http://"+h+"/gc-87323-gateway/site",timeout=2) as response:
                      body=response.read(32).decode().strip()
                      if response.status!=200 or body not in ("mumbai","osaka"):
                          raise RuntimeError("invalid response")
                      return body
              def sample(preferred, end):
                  counts=collections.Counter()
                  durations=[]
                  while time.monotonic()<end:
                      started=time.monotonic()
                      for addr in (preferred, hosts[1-hosts.index(preferred)]):
                          try:
                              body=fetch(addr)
                          except (OSError,RuntimeError):
                              counts["failed_http_attempts"]+=1
                              continue
                          counts["served_"+body]+=1
                          break
                      else:
                          counts["failed_requests"]+=1
                      durations.append(time.monotonic()-started)
                      time.sleep(.07)
                  durations.sort()
                  return dict(counts, requests=len(durations),
                              p99_ms=round(1000*durations[math.ceil(.99*len(durations))-1]))
              for index,host in enumerate(hosts):
                  other=hosts[1-index]
                  with concurrent.futures.ThreadPoolExecutor() as pool:
                      end=time.monotonic()+38
                      streams=[pool.submit(sample,pref,end) for pref in hosts]
                      time.sleep(3)
                      try:
                          call(host,"origin-stop")
                          target=("osaka","mumbai")[index]
                          deadline=time.monotonic()+12
                          while time.monotonic()<deadline:
                              try:
                                  if fetch(other)==target: break
                              except OSError:
                                  pass
                              time.sleep(.2)
                          else: raise RuntimeError("surviving public gateway failed to reach "+target)
                          print("Surviving public gateway",other,"served",target,flush=True)
                          time.sleep(7)
                      finally:
                          call(host,"origin-start")
                      for pref,stream in zip(hosts,streams):
                          metrics=stream.result()
                          print("EXTERNAL_SAMPLE",json.dumps(dict(outage=host,preferred=pref,**metrics)),flush=True)
                          assert metrics["requests"]>0
                  l7("200:mumbai")
          finally:
              for host in hosts:
                  call(host,"resume")
                  call(host,"resume-l7")
                  call(host,"restore")
          PY
