name: v0.1 EOD 750 Mbps single-gateway diagnostic (nonproduction)
on:
  pull_request:
    paths:
      - "tests/CI/stack/backend.py"
      - "tests/CI/eod/**"
      - ".github/workflows/eod-750mbps-ci-canary.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: eod-750-canary-${{ github.ref }}
  cancel-in-progress: true
jobs:
  single-gateway-bandwidth:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Fail-closed canary parser unit tests
        run: python3 -m unittest discover -s tests/CI/eod -p 'test_*.py' -v
      - name: Check and start isolated real .NET 10 gateway + backend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/eod-750
          # Compose interpolates all services, even though Grafana is not started here.
          ci_secret=$(openssl rand -hex 24)
          echo "::add-mask::$ci_secret"
          export GRAFANA_CI_PASSWORD="$ci_secret"
          echo "GRAFANA_CI_PASSWORD=$ci_secret" >> "$GITHUB_ENV"
          docker compose -f tests/CI/stack/compose.yml config --quiet
          docker compose -f tests/CI/stack/compose.yml up -d --build backend-a backend-b gateway-a
          ready=0
          for attempt in $(seq 1 90); do
            if (( attempt % 20 == 0 )); then echo "Gateway readiness attempt $attempt/90"; fi
            if docker compose -f tests/CI/stack/compose.yml exec -T gateway-a \
              curl --noproxy '*' --max-time 3 -fsS \
              http://127.0.0.1:8080/api/body/1048576 -o /dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
      - name: Verify official oha executable version and immutable pulled digest
        shell: bash
        run: |
          set -euo pipefail
          docker pull ghcr.io/hatoo/oha:latest
          version=$(docker run --rm ghcr.io/hatoo/oha:latest --version)
          test "$version" = "oha 1.16.0"
          echo "OHA_IMAGE=$(docker image inspect ghcr.io/hatoo/oha:latest --format '{{index .RepoDigests 0}}')" >> "$GITHUB_ENV"
          echo "$version" > artifacts/eod-750/oha-version.txt
      - name: Record direct-backend and single-gateway 1 MiB body tests
        shell: bash
        run: |
          set -euo pipefail
          for target in backend-a gateway-a; do
            echo "CI synthetic 1 MiB test against $target (20 seconds; not a 1-hour test)"
            timeout --signal=TERM --kill-after=10s 60s \
              docker run --rm --network yarp-01-ci_lab "$OHA_IMAGE" \
              --no-tui --output-format json --latency-correction \
              --disable-compression --wait-ongoing-requests-after-deadline --http-version 1.1 \
              -z 20s -q 120 -c 24 --worker-threads 4 \
              "http://$target:8080/api/body/1048576" \
              > "artifacts/eod-750/$target.json"
          done
          python3 tests/CI/eod/check_canary.py --folder artifacts/eod-750 \
            --required-gbps 0.75 --out artifacts/eod-750/decision.json
      - name: Attach raw CI evidence and always destroy disposable resources
        if: always()
        shell: bash
        run: |
          set +e
          export GRAFANA_CI_PASSWORD="${GRAFANA_CI_PASSWORD:-CI-only-cleanup-placeholder}"
          docker compose -f tests/CI/stack/compose.yml ps -a > artifacts/eod-750/compose-ps.txt 2>&1
          docker compose -f tests/CI/stack/compose.yml logs --no-color > artifacts/eod-750/compose.log 2>&1
          docker compose -f tests/CI/stack/compose.yml down -v --remove-orphans
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eod-750mbps-real-yarp-short-canary
          path: artifacts/eod-750/
          retention-days: 14
