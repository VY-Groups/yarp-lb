name: Manually requested long-duration k6 soak (non-production)

on:
  # Explicit gate PR for the P0 hang investigation; no general PR load runs.
  pull_request:
    paths: [".github/workflows/extended-soak.yml"]
  # Explicit, one-off branch trigger for the user-requested one-hour CI run.
  # Do not include main or all feature branches: this is a costly runner.
  push:
    branches: ["ci/soak-onehour-0.1"]
  workflow_dispatch:
    inputs:
      duration:
        description: "Sustained load duration on disposable GitHub runner"
        required: true
        default: "1h"
        type: choice
        options: ["15m", "1h", "4h"]
      vus:
        description: "Virtual users (not capacity certification)"
        required: true
        default: "75"
        type: choice
        options: ["75", "500", "1000"]
      payload_bytes:
        description: "Response payload bytes"
        required: true
        default: "0"
        type: choice
        options: ["0", "1024", "65536"]
      connection_reuse:
        description: "Keep TCP connections open between requests"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]

permissions:
  contents: read

concurrency:
  group: extended-soak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  soak:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build disposable gateway and mock backends
        run: |
          dotnet build tests/L7/GatewayLab/GatewayLab.csproj -c Release
          dotnet build tests/L7/BackendLab/BackendLab.csproj -c Release
          dotnet build tests/L7/Acceptance/Acceptance.csproj -c Release
      - name: Run soak, sample process working-set and GC collections
        shell: bash
        env:
          DURATION: ${{ inputs.duration || '1h' }}
          VUS: ${{ inputs.vus || '75' }}
          PAYLOAD_BYTES: ${{ inputs.payload_bytes || '0' }}
          REUSE_CONNECTIONS: ${{ inputs.connection_reuse || 'true' }}
          SOAK_REQUIRE_PRODUCT_LOGGING: "1"
          SOAK_MAX_HIGH_PRIORITY_DROPS: "0"
        run: |
          set -euo pipefail
          mkdir -p artifacts/soak
          # Keep the lab alive a little longer than the k6 deadline; never 310
          # minutes for a nominal 1-hour job, and never run unbounded.
          case "$DURATION" in
            15m) hold_minutes=25; hard_seconds=1200; export SOAK_EXPECTED_WINDOWS=3 ;;
            1h) hold_minutes=75; hard_seconds=4200; export SOAK_EXPECTED_WINDOWS=12 ;;
            4h) hold_minutes=260; hard_seconds=15000; export SOAK_EXPECTED_WINDOWS=48 ;;
            *) echo "Unsupported soak duration $DURATION"; exit 64 ;;
          esac
          dotnet tests/L7/Acceptance/bin/Release/net10.0/Acceptance.dll "$GITHUB_WORKSPACE" --hold "$hold_minutes" >artifacts/soak/lab.log 2>&1 &
          rig_pid=$!
          load_pid=""
          trap 'if [[ -n "$load_pid" ]]; then kill "$load_pid" 2>/dev/null || true; fi; kill "$rig_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 120); do
            if curl --connect-timeout 1 --max-time 3 -fsS http://127.0.0.1:18080/lab/stats >artifacts/soak/before.json; then ready=1; break; fi
            sleep 0.3
          done
          if [[ "$ready" != 1 ]]; then cat artifacts/soak/lab.log; exit 1; fi
          if [[ "$REUSE_CONNECTIONS" = true ]]; then noreuse=0; else noreuse=1; fi
          export SOAK_START_EPOCH_MS="$(($(date +%s) * 1000))"
          # A hard timeout prevents stalled Docker/k6 process teardown from
          # consuming hours beyond the requested load window.
          timeout --signal=TERM --kill-after=30s "${hard_seconds}s" \
            docker run --rm --network host --user "$(id -u):$(id -g)" \
            -e MODE=proxy -e TARGET=http://127.0.0.1:18080 -e DURATION="$DURATION" \
            -e VUS="$VUS" -e PAYLOAD_BYTES="$PAYLOAD_BYTES" -e NO_REUSE="$noreuse" \
            -e SOAK_START_EPOCH_MS="$SOAK_START_EPOCH_MS" \
            -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            grafana/k6:0.55.0 run \
            --summary-export=/workspace/artifacts/soak/k6-summary.json \
            /workspace/tests/L7/performance/load.js >artifacts/soak/k6-stdout.log 2>&1 &
          load_pid=$!
          launch=$SECONDS
          while kill -0 "$load_pid" 2>/dev/null; do
            # Stats can become unresponsive during the exact failure we need to measure.
            # Never let an unbounded curl block evidence collection and step teardown.
            if curl --connect-timeout 1 --max-time 3 -fsS http://127.0.0.1:18080/lab/stats >>artifacts/soak/process-samples.jsonl; then
              printf '\n' >>artifacts/soak/process-samples.jsonl
            fi
            if (( SECONDS - launch > hard_seconds + 45 )); then
              echo "SOAK_WATCHDOG_TIMEOUT: load process did not exit" >&2
              kill "$load_pid" 2>/dev/null || true
              break
            fi
            sleep 30
          done
          # Preserve the threshold failure status, but always attempt evidence
          # summarization before returning a red CI result.
          set +e
          wait "$load_pid"
          k6_status=$?
          set -e
          load_pid=""
          if [[ ! -s artifacts/soak/k6-summary.json ]]; then
            echo "Missing k6 JSON summary (exit $k6_status)" >&2
            exit 1
          fi
          if ! curl --connect-timeout 1 --max-time 3 -fsS http://127.0.0.1:18080/lab/stats >artifacts/soak/after.json; then
            rm -f artifacts/soak/after.json
            echo "SOAK_WARNING: final live metrics unavailable; analyzer will use last valid sample" >&2
          fi
          report_status=0
          python tests/L7/performance/soak_summary.py artifacts/soak || report_status=$?
          if (( k6_status != 0 || report_status != 0 )); then
            echo "SOAK_FAILED: k6 exit=$k6_status, sustained-window gate=$report_status" >&2
            exit 1
          fi
          echo "SOAK_PASSED: k6 and every sustained availability window passed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: long-soak-evidence
          path: artifacts/soak/
          retention-days: 30
