name: External HTTP origin integrations - Apache and Nginx
on:
  pull_request:
    paths:
      - "control-center/**"
      - "tests/E2E/real_http_origins.py"
      - "tests/E2E/real_control_center.py"
      - ".github/workflows/external-origins-e2e.yml"
  push:
    branches: [main]
    paths:
      - "control-center/**"
      - "tests/E2E/real_http_origins.py"
      - "tests/E2E/real_control_center.py"
      - ".github/workflows/external-origins-e2e.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: real-web-origins-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apache-nginx:
    name: Real Apache/Nginx HTTP via YARP + Nginx ingress-style chain
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build shipping production-mode Control Center
        run: dotnet build control-center/GatewayCoreYarp.csproj --configuration Release
      - name: Pull real Apache and Nginx containers
        run: |
          docker pull httpd:2.4-alpine
          docker pull nginx:1.28-alpine
      - name: Run actual HTTP server and ingress-style reverse-proxy chain
        run: python tests/E2E/real_http_origins.py
