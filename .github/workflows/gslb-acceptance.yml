name: GSLB authoritative DNS health/failover acceptance
on:
  push:
    branches: [main, "feature/**"]
    paths: ["engines/GslbDns/**", "engines/GslbObserver/**", "tests/GslbAcceptance/**", "ops/acceptance/dns_wire_probe.py", ".github/workflows/gslb-acceptance.yml"]
  pull_request:
    paths: ["engines/GslbDns/**", "engines/GslbObserver/**", "tests/GslbAcceptance/**", "ops/acceptance/dns_wire_probe.py", ".github/workflows/gslb-acceptance.yml"]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  authoritative-dns:
    runs-on: ${{ matrix.os }}
    name: DNS health/weight/DR - ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: "10.0.x"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.x"}
      - run: dotnet build engines/GslbDns/GslbDns.csproj -c Release
      - run: dotnet run --project tests/GslbAcceptance/GslbAcceptance.csproj -c Release -- "${{ github.workspace }}"
      - name: Real authoritative DNS UDP/TCP/EDNS/negative-answer wire acceptance
        run: python tests/GslbAcceptance/wire_probe_acceptance.py
      - run: dotnet build engines/GslbObserver/GslbObserver.csproj -c Release
      - name: Two DNS nodes and two TLS-authenticated external health validators
        if: runner.os == 'Linux'
        run: python tests/GslbAcceptance/external_validation.py
      - name: mTLS signed asynchronous agent reports and replay-safe DNS quorum
        if: runner.os == 'Linux'
        run: python tests/GslbAcceptance/agent_reports.py
      - run: python tests/GslbAcceptance/ipv6_transport.py
      - name: Install independent DNS clients
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y dnsutils knot-dnsutils
      - name: Validate DNSSEC signatures and denial proofs independently
        if: runner.os == 'Linux'
        run: |
          python -m venv .venv-dnssec
          . .venv-dnssec/bin/activate
          python -m pip install --disable-pip-version-check dnspython==2.9.2 cryptography==50.0.2
          python tests/GslbAcceptance/dnssec_signing.py
      - name: Query IPv6 authority with BIND and Knot over UDP and TCP
        if: runner.os == 'Linux'
        run: python tests/GslbAcceptance/ipv6_transport.py --interop
