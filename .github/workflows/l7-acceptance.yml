name: YARP 0.1 - L7 build and traffic acceptance

on:
  push:
    branches: [main, "ci/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: l7-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  l7-acceptance:
    name: L7 real HTTP - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Verify SDK version
        run: dotnet --info

      - name: Build YARP policy gateway
        run: dotnet build tests/L7/GatewayLab/GatewayLab.csproj -c Release

      - name: Build test backends
        run: dotnet build tests/L7/BackendLab/BackendLab.csproj -c Release

      - name: Build integration test runner
        run: dotnet build tests/L7/Acceptance/Acceptance.csproj -c Release

      - name: Send real requests through YARP and verify failover
        run: dotnet run --project tests/L7/Acceptance/Acceptance.csproj -c Release --no-build -- "${{ github.workspace }}"

      - name: Upload PASS/FAIL report and process logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l7-evidence-${{ matrix.os }}
          path: artifacts/l7/
          if-no-files-found: warn
          retention-days: 14

  performance-soak:
    name: 75-client k6 HTTP load (Ubuntu, 45s)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build isolated gateway and backends
        run: |
          dotnet build tests/L7/GatewayLab/GatewayLab.csproj -c Release
          dotnet build tests/L7/BackendLab/BackendLab.csproj -c Release
          dotnet build tests/L7/Acceptance/Acceptance.csproj -c Release
      - name: Compare direct backends, HTTP proxy and HTTPS proxy under the same load
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/k6
          dotnet tests/L7/Acceptance/bin/Release/net10.0/Acceptance.dll "$GITHUB_WORKSPACE" --hold >artifacts/k6/load-rig.log 2>&1 &
          runner_pid=$!
          trap 'kill "$runner_pid" 2>/dev/null || true; wait "$runner_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 150); do
            if curl --silent --fail http://127.0.0.1:18080/lab/stats > artifacts/k6/before.json &&
               curl --silent --fail --insecure https://127.0.0.1:18443/lab/ping >/dev/null; then ready=1; break; fi
            sleep 0.3
          done
          if [[ "$ready" != 1 ]]; then cat artifacts/k6/load-rig.log; exit 1; fi

          for phase in direct proxy-http proxy-https; do
            case "$phase" in
              direct) mode=direct; target=http://127.0.0.1:18081; tls=0;;
              proxy-http) mode=proxy; target=http://127.0.0.1:18080; tls=0;;
              proxy-https) mode=proxy; target=https://127.0.0.1:18443; tls=1;;
            esac
            docker run --rm --network host --user "$(id -u):$(id -g)" \
              -e MODE="$mode" -e TARGET="$target" -e LAB_TLS="$tls" -e DURATION=20s -e VUS=75 \
              -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
              grafana/k6:0.55.0 run \
              --summary-export="/workspace/artifacts/k6/$phase.json" \
              /workspace/tests/L7/performance/load.js
            test -s "artifacts/k6/$phase.json"
          done
          curl --silent --show-error --fail http://127.0.0.1:18080/lab/stats > artifacts/k6/after.json
          python tests/L7/performance/compare.py artifacts/k6

      - name: Upload benchmark and memory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l7-k6-performance-ubuntu
          path: artifacts/k6/
          retention-days: 14

  ha-failure-injection:
    name: HA ingress failover (two YARP nodes) - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build app backends and YARP gateway
        run: |
          dotnet build tests/L7/GatewayLab/GatewayLab.csproj -c Release
          dotnet build tests/L7/BackendLab/BackendLab.csproj -c Release
          dotnet build tests/HA/Acceptance/Acceptance.csproj -c Release
      - name: Kill gateway, verify last-known config and health-aware ingress recovery
        run: dotnet run --project tests/HA/Acceptance/Acceptance.csproj -c Release --no-build -- "${{ github.workspace }}"
      - name: Upload HA failure injection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ha-evidence-${{ matrix.os }}
          path: artifacts/ha/
          retention-days: 14
