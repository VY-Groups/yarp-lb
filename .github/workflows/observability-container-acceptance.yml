name: OTLP Collector, Prometheus and Grafana container acceptance
on:
  pull_request:
    paths:
      - "control-center/GatewayOpenTelemetry.cs"
      - "control-center/OtlpEndpointPolicy.cs"
      - "control-center/tests/EngineConfigSecurityTests/**"
      - "control-center/ops/observability/**"
      - "control-center/ops/prometheus/gateway-dashboard.json"
      - "control-center/ops/prometheus/gateway-alerts.yml"
      - "control-center/ops/observability/alertmanager.yml"
      - "control-center/ops/observability/alert-delivery-test.yml"
      - "control-center/ops/observability/alert-receiver/**"
      - ".github/workflows/observability-container-acceptance.yml"
  push:
    branches: [main]
    paths:
      - "control-center/GatewayOpenTelemetry.cs"
      - "control-center/OtlpEndpointPolicy.cs"
      - "control-center/tests/EngineConfigSecurityTests/**"
      - "control-center/ops/observability/**"
      - "control-center/ops/prometheus/gateway-dashboard.json"
      - "control-center/ops/prometheus/gateway-alerts.yml"
      - "control-center/ops/observability/alertmanager.yml"
      - "control-center/ops/observability/alert-delivery-test.yml"
      - "control-center/ops/observability/alert-receiver/**"
      - ".github/workflows/observability-container-acceptance.yml"
permissions:
  contents: read
jobs:
  otlp-container-stack:
    name: Real OTLP Collector to Prometheus and Grafana
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Validate dashboard and container configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 control-center/ops/prometheus/validate_gateway_dashboard.py
          python3 -m unittest discover -s control-center/ops/observability/alert-receiver -p 'test_*.py'
          docker compose -f control-center/ops/observability/compose.yml config --quiet
      - name: Start isolated observability stack
        shell: bash
        run: docker compose -f control-center/ops/observability/compose.yml up -d --build
      - name: Export real spans, metrics and sanitized access summaries to Collector, then verify Prometheus and Grafana
        shell: bash
        env:
          GATEWAY_OTLP_CONTAINER_ENDPOINT: http://127.0.0.1:4318
        run: |
          set -euo pipefail
          collector_log="$RUNNER_TEMP/otel-collector.log"
          alert_delivery_log="$RUNNER_TEMP/alert-delivery-events.json"
          compose_state="$RUNNER_TEMP/observability-compose-state.txt"
          cleanup() {
            docker compose -f control-center/ops/observability/compose.yml ps -a > "$compose_state" 2>&1 || true
            docker compose -f control-center/ops/observability/compose.yml logs --no-color > "$collector_log" 2>&1 || true
            curl -fsS http://127.0.0.1:18080/events > "$alert_delivery_log" 2>/dev/null || true
            docker compose -f control-center/ops/observability/compose.yml down --volumes --remove-orphans
          }
          trap cleanup EXIT

          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9090/-/ready >/dev/null && \
               curl -fsS http://127.0.0.1:3000/api/health >/dev/null && \
               curl -fsS http://127.0.0.1:9093/-/ready >/dev/null && \
               curl -fsS http://127.0.0.1:18080/ready >/dev/null; then break; fi
            if [ "$attempt" -eq 60 ]; then echo "Observability containers did not become ready" >&2; exit 1; fi
            sleep 2
          done

          # The security suite now starts a real shipping controller during
          # fleet recovery acceptance; build both executables before running it.
          dotnet build control-center/GatewayCoreYarp.csproj -c Release
          dotnet build control-center/GatewayAgent/GatewayCoreGatewayAgent.csproj -c Release
          (cd control-center && dotnet run --project tests/EngineConfigSecurityTests/EngineConfigSecurityTests.csproj -c Release)

          query_until_present() {
            local query="$1"
            for attempt in $(seq 1 30); do
              local result
              result=$(curl -fsSG --data-urlencode "query=$query" http://127.0.0.1:9090/api/v1/query)
              if jq -e '.status == "success" and (.data.result | length > 0)' <<<"$result" >/dev/null; then return 0; fi
              sleep 2
            done
            echo "Prometheus did not expose expected OTLP series: $query" >&2
            return 1
          }

          query_until_present 'gateway_proxy_requests_total{http_response_status_class="5xx"}'
          query_until_present 'gateway_proxy_request_duration_milliseconds_bucket'
          query_until_present 'ALERTS{alertname="GatewayCoreObservabilityDeliveryTest",alertstate="firing"}'
          delivered=false
          for attempt in $(seq 1 30); do
            events=$(curl -fsS http://127.0.0.1:18080/events)
            if jq -e 'any(.events[]; any(.alerts[]; .status == "firing" and .alertname == "GatewayCoreObservabilityDeliveryTest"))' <<<"$events" >/dev/null; then
              delivered=true
              break
            fi
            sleep 2
          done
          if [ "$delivered" != true ]; then
            echo "Prometheus fired the fixture alert but Alertmanager did not deliver it to the webhook receiver" >&2
            curl -fsS http://127.0.0.1:9093/api/v2/alerts || true
            printf '%s\n' "$events" >&2
            exit 1
          fi
          curl -fsS 'http://127.0.0.1:9090/api/v1/rules' | jq -e 'any(.data.groups[]; .name == "yarp-onprem-ops")' >/dev/null
          curl -fsS 'http://127.0.0.1:3000/api/search?query=GatewayCore' | jq -e 'any(.[]; .uid == "gatewaycore-http-availability")' >/dev/null

          docker compose -f control-center/ops/observability/compose.yml logs --no-color otel-collector > "$RUNNER_TEMP/otel-collector-live.log"
          grep -q 'container_acceptance_route' "$RUNNER_TEMP/otel-collector-live.log"
          grep -q 'gateway.proxy.requests' "$RUNNER_TEMP/otel-collector-live.log"
          grep -q 'GATEWAY_TELEMETRY_ACCESS' "$RUNNER_TEMP/otel-collector-live.log"
          grep -q 'timestampUtc' "$RUNNER_TEMP/otel-collector-live.log"
          grep -q 'route_acceptance' "$RUNNER_TEMP/otel-collector-live.log"
          # No local access message or client/forwarded IP field is permitted
          # in the independent Collector, even though local access logs retain
          # these fields for restricted operations.
          if grep -Eq 'GATEWAY_ACCESS|clientIp|clientIpSource|203\\.0\\.113\\.17|otlp-secret-canary|Authorization|Cookie|/private' "$RUNNER_TEMP/otel-collector-live.log"; then
            echo "Local access/IP, request URL, header or secret leaked to Collector output" >&2
            exit 1
          fi
          if grep -Eq '203\.0\.113\.99|otlp-container-secret-canary|/private' "$RUNNER_TEMP/otel-collector-live.log"; then
            echo "Sensitive client or URL value leaked to Collector output" >&2
            exit 1
          fi
          echo "PASS: Collector ingested redacted traces, metrics and IP-free access summaries; Prometheus queried OTLP series; Grafana loaded provisioned dashboard"
          echo "PASS: Prometheus firing alert was delivered through Alertmanager to the isolated webhook receiver"
      - name: Upload Collector evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: otlp-container-collector-log
          path: |
            ${{ runner.temp }}/otel-collector.log
            ${{ runner.temp }}/otel-collector-live.log
            ${{ runner.temp }}/alert-delivery-events.json
            ${{ runner.temp }}/observability-compose-state.txt
          if-no-files-found: ignore

