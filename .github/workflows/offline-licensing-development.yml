name: Offline commercial license verifier (development)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feature/offline-commercial-licensing, feature/commercial-fleet-proof, feature/commercial-fleet-recovery-fence]
    paths:
      - 'src/GatewayCore.Licensing/**'
      - 'src/CommercialEngine/**'
      - 'engines/**'
      - 'tests/E2E/commercial_engines.py'
      - 'tests/OfflineLicensing/**'
      - 'tests/E2E/offline_commercial.py'
      - 'tests/E2E/release_integrity.py'
      - 'control-center/**'
      - 'tests/FleetQuorumAcceptance/**'
      - 'tests/WafEtcd/commercial_fleet_quorum.py'
      - '.github/workflows/offline-licensing-development.yml'
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: dotnet run --project tests/OfflineLicensing/OfflineLicensing.csproj --configuration Release

      - name: Compile commercial gateway against disposable public trust
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            dotnet run --project tests/OfflineLicensing/OfflineLicensing.csproj --configuration Release -- --ci-authority "$RUNNER_TEMP/commercial-ci-authority"
            trust="$RUNNER_TEMP/commercial-ci-authority/public-trust.json"
          else
            trust="$RUNNER_TEMP/commercial-public-trust.json"
            dotnet run --project tests/OfflineLicensing/OfflineLicensing.csproj --configuration Release -- --ci-trust "$trust"
          fi
          dotnet build control-center/GatewayCoreYarp.csproj --configuration Release -p:GatewayCoreCommercial=true -p:GatewayCoreTrustFile="$trust"
      - name: Actual commercial gateway activation with no network except loopback
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo unshare --net -- bash -ec '
            ip link set lo up
            exec runuser -u "$1" -- env PATH="$2" DOTNET_ROOT="$3" CI=true GITHUB_ACTIONS=true python3 tests/E2E/offline_commercial.py "$4"
          ' _ "$(id -un)" "$PATH" "$DOTNET_ROOT" "$RUNNER_TEMP/commercial-ci-authority"
      - name: Published commercial package startup integrity
        run: python tests/E2E/release_integrity.py
      - name: Commercial independent engine feature acceptance
        run: python tests/E2E/commercial_engines.py
      - name: Remove disposable signing fixture
        if: always() && runner.os == 'Linux'
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/commercial-ci-authority"

  commercial-fleet-transaction:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build isolated commercial and ordinary test executables
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/commercial-fleet-transaction"
          mkdir -p "$root"
          dotnet build tests/OfflineLicensing/OfflineLicensing.csproj -c Release -o "$root/fixture"
          dotnet "$root/fixture/OfflineLicensing.dll" --ci-engine-key "$root/keys"
          dotnet build control-center/GatewayAgent/GatewayCoreGatewayAgent.csproj -c Release
          dotnet build control-center/GatewayAgent/GatewayCoreGatewayAgent.csproj -c Release -o "$root/agent" -p:GatewayCoreCommercial=true -p:GatewayCoreTrustFile="$root/keys/trust.json"
          dotnet build control-center/GatewayCoreYarp.csproj -c Release -o "$root/gateway" -p:GatewayCoreCommercial=true -p:GatewayCoreTrustFile="$root/keys/trust.json"
          dotnet build control-center/tests/EngineConfigSecurityTests/EngineConfigSecurityTests.csproj -c Release
          dotnet build tests/FleetQuorumAcceptance/FleetQuorumAcceptance.csproj -c Release
          # etcd v3.6.16 digest verified in prior successful real-quorum CI.
          selected="quay.io/coreos/etcd@sha256:a9c7cc12156f4b26ca41f0b57ba5b76c45037ff6c1e47ea3d68cb7908d48a965"
          docker pull "$selected"
          echo "ETCD_IMAGE=$selected" >> "$GITHUB_ENV"
      - name: Real licensed controller and two agents with production CRL validation, rollout and revoked recovery
        shell: bash
        run: |
          set -euo pipefail
          export GATEWAY_COMMERCIAL_RECOVERY_ROOT="$RUNNER_TEMP/commercial-fleet-transaction"
          export GATEWAY_FLEET_RECOVERY_TEST_DLL="$GITHUB_WORKSPACE/control-center/tests/EngineConfigSecurityTests/bin/Release/net10.0/EngineConfigSecurityTests.dll"
          export GC_FLEET_QUORUM_DLL="$GITHUB_WORKSPACE/tests/FleetQuorumAcceptance/bin/Release/net10.0/FleetQuorumAcceptance.dll"
          python3 tests/WafEtcd/commercial_fleet_quorum.py
      - name: Remove disposable signing material
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/commercial-fleet-transaction"
