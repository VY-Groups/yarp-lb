name: Offline commercial license verifier (development)
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/GatewayCore.Licensing/**'
      - 'tests/OfflineLicensing/**'
      - 'tools/LicenseAuthority/**'
      - 'control-center/**'
      - '.github/workflows/offline-licensing-development.yml'
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project tests/OfflineLicensing/OfflineLicensing.csproj --configuration Release

      - name: Compile commercial gateway against disposable public trust
        shell: bash
        run: |
          dotnet run --project tests/OfflineLicensing/OfflineLicensing.csproj --configuration Release -- --ci-trust "$RUNNER_TEMP/commercial-public-trust.json"
          dotnet build control-center/GatewayCoreYarp.csproj --configuration Release -p:GatewayCoreCommercial=true -p:GatewayCoreTrustFile="$RUNNER_TEMP/commercial-public-trust.json"
