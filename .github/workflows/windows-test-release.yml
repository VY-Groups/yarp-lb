name: Windows x64 HTTP origin test pre-release
on:
  pull_request:
    paths:
      - "ops/windows-test/**"
      - ".github/workflows/windows-test-release.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gatewaycore-windows-test-release
  cancel-in-progress: true
jobs:
  build-test-publish:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'release/windows-e2e-tested-test8-20261114'
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate launcher parses
        shell: pwsh
        run: |
          $tokens=$null; $parseErrors=$null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ops/windows-test/Start-GatewayCore-Test.ps1),
            [ref]$tokens,[ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -ne 0) { throw ($parseErrors | Out-String) }
      - name: Verify UI TypeScript build and onboarding regression tests
        shell: pwsh
        run: |
          npx --yes --package typescript@5.9.3 tsc --project control-center/wwwroot/tsconfig.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- control-center/wwwroot/app.js
          if ($LASTEXITCODE -ne 0) { throw 'Checked-in browser JS differs from TypeScript output' }
          node control-center/tests/test_onboarding_ui.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node control-center/tests/test_setup_ui.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node control-center/tests/test_auth_ui.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node control-center/tests/test_five_screens.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify Windows legacy state is rejected before bootstrap
        shell: pwsh
        run: |
          dotnet run --project control-center/tests/LegacyStateGuardTests/LegacyStateGuardTests.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build self-contained Windows x64 release
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $stage=Join-Path $env:RUNNER_TEMP 'GatewayCore-v0.1.0-test.8-win-x64'
          New-Item -ItemType Directory -Force -Path (Join-Path $stage 'app') | Out-Null
          dotnet publish control-center/GatewayCoreYarp.csproj -c Release -r win-x64 --self-contained true -p:PublishReadyToRun=false -o (Join-Path $stage 'app')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item ops/windows-test/Start-GatewayCore-Test.ps1 $stage
          Copy-Item ops/windows-test/README.md $stage
          if (-not (Test-Path (Join-Path $stage 'app/GatewayCoreYarp.exe'))) { throw 'Windows exe missing' }
          "SOURCE_COMMIT=$env:HEAD_SHA" | Set-Content -Encoding ascii (Join-Path $stage 'SOURCE_COMMIT.txt')
          "PRERELEASE — local IIS reverse-proxy testing only; production NO-GO." | Add-Content (Join-Path $stage 'SOURCE_COMMIT.txt')
          echo "STAGE=$stage" >> $env:GITHUB_ENV
      - name: 'Real executable - local IIS-like backend and gateway proxy smoke'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $stage=$env:STAGE
          $exe=Join-Path $stage 'app/GatewayCoreYarp.exe'
          $backend=$null; $gateway=$null
          try {
            $backend=Start-Process python -ArgumentList '-m','http.server','18081','--bind','127.0.0.1' -PassThru -WindowStyle Hidden
            & (Join-Path $stage 'Start-GatewayCore-Test.ps1') -IisBackendUrl 'http://127.0.0.1:18081/' -PrepareOnly
            if ($LASTEXITCODE -ne 0) { throw 'PrepareOnly returned failure' }
            & (Join-Path $stage 'Start-GatewayCore-Test.ps1') -IisBackendUrl 'http://127.0.0.1:18081/' -ReuseExistingTestState -PrepareOnly
            if ($LASTEXITCODE -ne 0) { throw 'Explicit idempotent test reuse failed' }
            $env:ASPNETCORE_URLS='http://127.0.0.1:8080'
            $env:ASPNETCORE_ENVIRONMENT='Production'
            $env:YARP_LISTENERS_CONFIG_FILE=''
            $gateway=Start-Process -FilePath $exe -WorkingDirectory (Join-Path $stage 'app') -PassThru -RedirectStandardOutput (Join-Path $env:RUNNER_TEMP 'gateway-out.txt') -RedirectStandardError (Join-Path $env:RUNNER_TEMP 'gateway-err.txt')
            $ok=$false
            for($i=0;$i -lt 50;$i++) {
              if ($gateway.HasExited) { throw "Gateway exited early: $($gateway.ExitCode)" }
              try {
                $up=Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:8080/gateway/health' -TimeoutSec 2
                $forward=Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:8080/proxy/' -TimeoutSec 2
                if ($up.StatusCode -eq 200 -and $forward.StatusCode -eq 200) { $ok=$true; break }
              } catch {}
              Start-Sleep -Seconds 1
            }
            if (-not $ok) { throw 'Gateway to IIS-like backend route not ready' }
            Write-Host 'PASS: real published GatewayCore.exe forwards localhost /proxy/ to test HTTP backend'
          } finally {
            if ($gateway -and -not $gateway.HasExited) { Stop-Process -Id $gateway.Id -Force }
            if ($backend -and -not $backend.HasExited) { Stop-Process -Id $backend.Id -Force }
            Get-Content (Join-Path $env:RUNNER_TEMP 'gateway-err.txt') -ErrorAction SilentlyContinue | Select-Object -Last 20
          }
      - name: Compress tested release payload and calculate SHA256
        shell: pwsh
        run: |
          $zip=Join-Path $env:RUNNER_TEMP 'GatewayCore-v0.1.0-test.8-win-x64.zip'
          Remove-Item (Join-Path $env:STAGE 'app/appsettings.json') -ErrorAction SilentlyContinue
          Compress-Archive -Path (Join-Path $env:STAGE '*') -DestinationPath $zip -CompressionLevel Optimal
          $hash=(Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          "$hash  GatewayCore-v0.1.0-test.8-win-x64.zip" | Set-Content -Encoding ascii (Join-Path $env:RUNNER_TEMP 'SHA256SUMS.txt')
          echo "RELEASE_ZIP=$zip" >> $env:GITHUB_ENV
      - name: Publish GitHub test pre-release (never production)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $tag='v0.1.0-test.8'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw "Tag $tag already published; refuse to silently replace an immutable test release." }
          $notes='**TEST PRE-RELEASE ONLY**. Windows x64 self-contained GatewayCore .NET 10 with localhost IIS, Apache, Nginx or other HTTP origin. The launcher parameter is still named -IisBackendUrl for backward compatibility; it never configures any origin server. Source SHA: '+$env:HEAD_SHA+'. Chromium/API E2E tests ran on the same application source tree before this packaging-only branch; Windows release workflow verifies real executable forwarding. No production approval. Requires an isolated Windows test machine and an existing local HTTP test site.'
          gh release create $tag $env:RELEASE_ZIP (Join-Path $env:RUNNER_TEMP 'SHA256SUMS.txt') --repo $env:GITHUB_REPOSITORY --target $env:HEAD_SHA --title 'GatewayCore v0.1.0-test.8 Windows x64 HTTP origin TEST' --prerelease --notes $notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Keep build evidence if release step fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gatewaycore-windows-test-release-evidence
          path: |
            ${{ runner.temp }}/SHA256SUMS.txt
            ${{ runner.temp }}/gateway-out.txt
            ${{ runner.temp }}/gateway-err.txt
          retention-days: 7
