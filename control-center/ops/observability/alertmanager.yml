global:
  resolve_timeout: 30s

route:
  receiver: gatewaycore-lab-webhook
  group_by: [alertname]
  group_wait: 1s
  group_interval: 5s
  repeat_interval: 1h

receivers:
  - name: gatewaycore-lab-webhook
    webhook_configs:
      - url: http://alert-receiver:8080/alerts
        send_resolved: true
        max_alerts: 20
        timeout: 3s

