rule_files:
  - collector-required-alerts.yml
evaluation_interval: 1m
tests:
  # An unrelated, successfully scraped gateway does not prove the required
  # Collector is present. Test absence even when Prometheus has other series.
  - interval: 1m
    input_series:
      - series: 'up{job="gatewaycore-gateway",instance="gateway-01"}'
        values: '1 1 1 1 1'
    alert_rule_test:
      - eval_time: 3m
        alertname: GatewayOtelCollectorTargetMissing
        exp_alerts:
          - exp_labels: {job: otel-collector, severity: critical}
            exp_annotations:
              summary: "GatewayCore required OTLP Collector target is absent"
              description: "Prometheus has no configured otel-collector scrape series. Check target inventory and rule wiring; an absent target must not silently count as healthy telemetry."
              runbook: "control-center/docs/OTEL_EXPORT.md"
  # One existing Collector target, even with a failed scrape, must not be
  # counted as missing inventory: the separate up == 0 alert covers failures.
  - interval: 1m
    input_series:
      - series: 'up{job="otel-collector",instance="otel-collector:8889"}'
        values: '0 0 0 0 0'
    alert_rule_test:
      - eval_time: 3m
        alertname: GatewayOtelCollectorTargetMissing
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'up{job="otel-collector",instance="otel-collector:8889"}'
        values: '1 1 1 1 1'
    alert_rule_test:
      - eval_time: 3m
        alertname: GatewayOtelCollectorTargetMissing
        exp_alerts: []
