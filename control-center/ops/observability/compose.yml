name: gatewaycore-observability-lab
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "127.0.0.1:4318:4318"
    volumes:
      - ./otel-collector.yml:/etc/otelcol-contrib/config.yaml:ro
    networks: [observability]

  alert-receiver:
    build:
      context: ./alert-receiver
    ports:
      - "127.0.0.1:18080:8080"
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    user: "65532:65532"
    tmpfs:
      - /tmp:mode=1777,size=16m
    networks: [observability]

  alertmanager:
    image: prom/alertmanager:v0.35.0
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/tmp/alertmanager"]
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    tmpfs:
      - /tmp:mode=1777,size=16m
    depends_on: [alert-receiver]
    networks: [observability]

  prometheus:
    image: prom/prometheus:v3.14.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=24h"]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/gateway-alerts.yml:/etc/prometheus/gateway-alerts.yml:ro
      - ./alert-delivery-test.yml:/etc/prometheus/alert-delivery-test.yml:ro
    depends_on: [otel-collector, alertmanager]
    networks: [observability]

  grafana:
    image: grafana/grafana:13.3.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../prometheus/gateway-dashboard.json:/var/lib/grafana/dashboards/gateway-dashboard.json:ro
    depends_on: [prometheus]
    networks: [observability]

networks:
  observability:
    driver: bridge

