global:
  scrape_interval: 2s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/gateway-alerts.yml
  - /etc/prometheus/alert-delivery-test.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8889]

