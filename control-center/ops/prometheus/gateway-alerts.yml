# Control Center actual metrics; requires same-host local agent and external TLS probe.
# P99 cap of 100ms is ONLY A PLACEHOLDER; match the approved test scenario before use.
groups:
  - name: gatewaycore-failover-recovery
    interval: 5s
    rules:
      - alert: GatewayFailoverRecoveryExceeded
        expr: probe_success{job="gatewaycore-availability"} == 0
        for: 10s
        labels: {severity: critical}
        annotations:
          summary: "GatewayCore service has not recovered within the 10-second failover budget"
          description: "Independent probe {{ $labels.instance }} has continuously observed {{ $labels.service }} unavailable in {{ $labels.region }}. This is user-visible outage duration; check gateway health, ingress, and DNS. The probe cannot identify which failover mechanism failed."
          runbook: "control-center/docs/AVAILABILITY_SLO.md"
  - name: yarp-onprem-ops
    interval: 30s
    rules:
      - record: gatewaycore:availability_probe_success:sample
        expr: probe_success{job="gatewaycore-availability"} or on(instance,service,region) (up{job="gatewaycore-availability"} * 0)
      - alert: YarpMetricsDown
        expr: up{job="gatewaycore-gateway"} == 0
        for: 1m
        labels: {severity: critical}
      - alert: GatewayOtelCollectorScrapeFailed
        # An OTLP-exporting gateway must not appear healthy solely because
        # its own scrape succeeds while the telemetry collector is down.
        # This rule fires only when an otel-collector scrape target exists;
        # inventory and absent-target detection remain operator-managed.
        expr: up{job="otel-collector"} == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "GatewayCore OTLP Collector scrape has failed"
          description: "Prometheus cannot scrape Collector {{ $labels.instance }}. Exported traces, access summaries and loss counters may be unavailable; verify the collector, exporter and independent audit path."
          runbook: "control-center/docs/OTEL_EXPORT.md"

      - alert: YarpMetricsAbsent
        expr: absent(yarp_control_http_requests_total{job="gatewaycore-gateway"})
        for: 2m
        labels: {severity: critical}
      - alert: YarpHigh5xxFraction
        # A request rate below 1/s must not be treated as 1/s: it hides the
        # actual 5xx fraction on quiet on-prem gateways. The tiny floor only
        # protects zero-traffic division; no traffic yields zero numerator.
        expr: (sum by (instance) (rate(yarp_control_http_responses_total{job="gatewaycore-gateway",status_class="5xx"}[5m])) / clamp_min(sum by (instance) (rate(yarp_control_http_requests_total{job="gatewaycore-gateway"}[5m])), 1e-9)) > 0.001
        for: 2m
        labels: {severity: critical}
      - alert: YarpHighP99
        expr: histogram_quantile(0.99, sum by (instance,le) (rate(yarp_control_http_duration_seconds_bucket{job="gatewaycore-gateway"}[5m]))) >= 0.100
        for: 5m
        labels: {severity: critical}
      - alert: YarpUnhealthyDestination
        expr: yarp_control_destination_active_health{job="gatewaycore-gateway"} < 0
        for: 1m
        labels: {severity: critical}
      - alert: YarpUnknownDestination
        expr: yarp_control_destination_active_health{job="gatewaycore-gateway"} == 0
        for: 2m
        labels: {severity: warning}
      - alert: YarpDestinationAdmissionRejected
        expr: increase(yarp_control_destination_admission_rejected_total{job="gatewaycore-gateway"}[5m]) > 0
        for: 0m
        labels: {severity: critical}
        annotations:
          summary: "GatewayCore rejected requests at a full destination queue"
          description: "Gateway {{ $labels.instance }} rejected one or more requests for {{ $labels.destination }} in the last five minutes. Check destination health, service capacity, and its configured admission limits."
          runbook: "control-center/docs/L7_LIFECYCLE_OBSERVABILITY.md"
      - alert: YarpDestinationAdmissionQueueTimeout
        expr: increase(yarp_control_destination_admission_queue_timeouts_total{job="gatewaycore-gateway"}[5m]) > 0
        for: 0m
        labels: {severity: critical}
        annotations:
          summary: "GatewayCore destination queue wait timed out"
          description: "Gateway {{ $labels.instance }} timed out one or more queued requests for {{ $labels.destination }} in the last five minutes. Check destination health, service capacity, and its configured queue timeout."
          runbook: "control-center/docs/L7_LIFECYCLE_OBSERVABILITY.md"
      - alert: YarpTLSExpiringWithin14Days
        expr: (probe_ssl_earliest_cert_expiry{job="gatewaycore-tls-probe"} - time()) < 1209600
        for: 5m
        labels: {severity: critical}
      - alert: YarpTLSProbeFailed
        expr: probe_success{job="gatewaycore-tls-probe"} == 0
        for: 1m
        labels: {severity: critical}
      - alert: GatewayAvailabilityFastBurn
        expr: ((1 - avg_over_time(gatewaycore:availability_probe_success:sample[30m])) / 0.001 > 14.4) and ((1 - avg_over_time(gatewaycore:availability_probe_success:sample[6h])) / 0.001 > 14.4)
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "GatewayCore 99.9% availability budget is burning rapidly"
          description: "The external HTTPS readiness probe is consuming the annual error budget rapidly for {{ $labels.service }} in {{ $labels.region }}."
      - alert: GatewayAvailabilityBudgetAtRisk
        expr: ((1 - avg_over_time(gatewaycore:availability_probe_success:sample[24h])) > 0.001) and (count_over_time(gatewaycore:availability_probe_success:sample[24h]) >= 8000)
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "GatewayCore 24-hour availability is below 99.9%"
          description: "Review failed samples and open an incident record for {{ $labels.service }} in {{ $labels.region }}."
      - alert: GatewayAvailabilityAnnualSLOViolation
        expr: (avg_over_time(gatewaycore:availability_probe_success:sample[365d]) < 0.999) and (count_over_time(gatewaycore:availability_probe_success:sample[365d]) >= 3090528)
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "GatewayCore rolling-year availability is below 99.9%"
          description: "The annual service objective is missed for {{ $labels.service }} in {{ $labels.region }}. Open an incident and track corrective work."
      - alert: GatewayAvailabilityAnnualCoverageInsufficient
        expr: count_over_time(gatewaycore:availability_probe_success:sample[365d]) < 3090528
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "GatewayCore annual availability is not yet measurable"
          description: "A full rolling-year SLI needs at least 98% of 10-second probe samples for {{ $labels.service }} in {{ $labels.region }}."
      - alert: GatewayAvailabilityProbeMissing
        expr: absent_over_time(gatewaycore:availability_probe_success:sample[2m])
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "GatewayCore availability probes are missing"
          description: "No external readiness probe samples have arrived; the SLI is unknown and cannot be considered healthy."
      - alert: GatewayAvailabilityProbeScrapeFailed
        expr: up{job="gatewaycore-availability"} == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "An external GatewayCore availability probe is unavailable"
          description: "Probe exporter scrape failed for {{ $labels.service }} in {{ $labels.region }}; count this monitoring gap as unavailable until recovered."
      - alert: GslbDnsMetricsDown
        expr: up{job="gatewaycore-gslb"} == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "GSLB DNS runtime metrics are unavailable"
          description: "The local scrape target {{ $labels.instance }} is down; DNS process health is unknown until telemetry returns."
      - alert: GslbNoLocallyHealthySites
        expr: (gatewaycore_gslb_configured_sites{job="gatewaycore-gslb"} > 0) and (gatewaycore_gslb_locally_healthy_sites{job="gatewaycore-gslb"} == 0)
        for: 30s
        labels: {severity: critical}
        annotations:
          summary: "GSLB node has no locally healthy backend sites"
          description: "All configured sites fail this DNS node's local probe hysteresis. Review the zone-specific DNS and health-check logs."
      - alert: GslbAgentQuorumBelowThreshold
        expr: gatewaycore_gslb_agent_quorum_targets{job="gatewaycore-gslb",state="below_quorum"} > 0
        for: 30s
        labels: {severity: critical}
        annotations:
          summary: "One or more GSLB agent report targets are below quorum"
          description: "At least one report-gated site lacks its configured local signed-agent quorum on {{ $labels.instance }}."
      - alert: GslbAgentReportStateWriteFailed
        expr: increase(gatewaycore_gslb_agent_reports_total{job="gatewaycore-gslb",result="storage_error"}[5m]) > 0
        for: 0m
        labels: {severity: critical}
        annotations:
          summary: "GSLB could not persist agent report replay state"
          description: "The DNS node rejected persistence of agent report state; inspect storage availability and filesystem permissions."
      # OTLP-to-Prometheus metric translation uses the collector scrape job;
      # direct gateway scrapes use gatewaycore-gateway. Cover both without
      # changing alert severity or the approved loss thresholds.
      - alert: YarpDroppedLogs
        expr: increase(yarp_logging_dropped_total{job=~"gatewaycore-gateway|otel-collector"}[5m]) > 0
        for: 1m
        labels: {severity: critical}
      - alert: YarpHighPriorityLogsDropped
        expr: increase(yarp_logging_dropped_high_priority_total{job=~"gatewaycore-gateway|otel-collector"}[5m]) > 0
        for: 0m
        labels: {severity: critical}
      - alert: YarpLogWriterError
        expr: increase(yarp_logging_write_errors_total{job=~"gatewaycore-gateway|otel-collector"}[5m]) > 0
        for: 1m
        labels: {severity: critical}
      - alert: GatewayAuditOutboxDeliveryFault
        # These identity-free gauges are OTLP-exported by the durable audit
        # worker. Never interpret an unconfigured audit outbox as healthy
        # delivery; inventory and actual signed remote receipts need their
        # own operational acceptance checks.
        expr: (gateway_audit_outbox_storage_fault{job="otel-collector"} == 1) or (gateway_audit_outbox_delivery_blocked{job="otel-collector"} == 1) or (gateway_audit_outbox_pending{job="otel-collector"} < 0)
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "GatewayCore durable audit outbox cannot deliver or inspect pending events"
          description: "External authenticated audit outbox on {{ $labels.service_instance_id }} reports blocked delivery, persistent storage fault or an unreadable pending count. Verify the admin-only audit delivery status and collector receipts before clearing the incident."
          runbook: "control-center/docs/EXTERNAL_AUDIT_INTENT.md"
      - alert: GatewayAuditOutboxWorkerStale
        # An enabled audit worker may terminate while last-known fault
        # gauges remain zero. The timestamp changes ONLY when the worker
        # completes a status pass, not when Prometheus scrapes it.
        expr: (gateway_audit_outbox_enabled{job="otel-collector"} == 1) and on(job,instance,service_instance_id) (time() - gateway_audit_outbox_last_update_unixtime{job="otel-collector"} > 90)
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "GatewayCore durable audit outbox worker status is stale"
          description: "Configured audit worker on {{ $labels.service_instance_id }} has not published a new status for over 90 seconds. Last-known healthy queue state is not delivery proof. Verify worker health, protected outbox API and signed remote receipts."
          runbook: "control-center/docs/EXTERNAL_AUDIT_INTENT.md"
