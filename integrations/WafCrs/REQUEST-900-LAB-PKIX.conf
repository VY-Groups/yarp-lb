# Disposable lab ONLY: exact request path+method+media type carve-out for
# legitimate CA/PKI uploads. Standard CRS 920420 denies application/pkix-cert.
# Preserve ALL other protocol / attack checks and the anomaly score threshold.
# Production exceptions require owner, expiry, review and rollback controls.
SecRule REQUEST_METHOD "@streq POST" \
    "id:1000420,phase:1,pass,nolog,t:none,chain"
    SecRule REQUEST_URI "@streq /acceptance" "t:none,chain"
        SecRule REQUEST_HEADERS:Content-Type "@streq application/pkix-cert" \
            "t:lowercase,ctl:ruleRemoveById=920420"
