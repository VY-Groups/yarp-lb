services:
  protected-app:
    image: python:3.12-alpine
    command: >
      sh -c "mkdir -p /srv/website &&
             echo 'YARP-WAF-CI-BENIGN' > /srv/website/index.html &&
             exec python -m http.server 8000 --bind 0.0.0.0 --directory /srv/website"
    expose: ["8000"]
    networks: ["waf-private"]
  waf:
    image: owasp/modsecurity-crs:nginx
    environment:
      BACKEND: http://protected-app:8000
      SERVER_NAME: localhost
      PORT: "8080"
      MODSEC_RULE_ENGINE: "${WAF_MODE:-On}"
      MODSEC_REQ_BODY_ACCESS: "On"
      MODSEC_REQ_BODY_LIMIT: "131072"
      MODSEC_REQ_BODY_NOFILES_LIMIT: "65536"
      MODSEC_REQ_BODY_LIMIT_ACTION: "Reject"
      BLOCKING_PARANOIA: "1"
      DETECTION_PARANOIA: "1"
      ANOMALY_INBOUND: "5"
      MODSEC_AUDIT_ENGINE: "On"
    ports:
      - "127.0.0.1:18888:8080"
    depends_on:
      - protected-app
    networks: ["waf-private"]
networks:
  waf-private:
    driver: bridge  # app is unexposed; published WAF loopback port remains reachable from host
