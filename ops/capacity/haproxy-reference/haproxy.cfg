# Disposable loopback benchmark reference, NOT production configuration.
# The same upstream (127.0.0.1:18081) can be used for YARP at /proxy/.
# Do not expose this listener, stats, or backend to external networks.
global
    log stdout format raw local0
    maxconn 4096

defaults
    mode http
    log global
    option httplog
    timeout connect 3s
    timeout client 30s
    timeout server 30s

frontend reference_http
    bind 127.0.0.1:19080
    default_backend test_origin
    http-request replace-path ^/proxy/(.*)$ /\1

backend test_origin
    balance roundrobin
    option httpchk GET /index.html
    http-check expect status 200
    default-server inter 2s fall 3 rise 2
    server origin_a 127.0.0.1:18081 check
