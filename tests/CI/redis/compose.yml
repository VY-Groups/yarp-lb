name: yarp-01-redis-ci
services:
  redis-primary:
    image: redis:7.4-alpine
    user: "0"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?CI REDIS_PASSWORD must be generated}
    command:
      - sh
      - -ec
      - |
        exec redis-server --port 0 --tls-port 6379 --tls-cert-file /certs/server.crt --tls-key-file /certs/server.key --tls-ca-cert-file /certs/ca.crt --tls-auth-clients no --requirepass "$$REDIS_PASSWORD" --appendonly yes
    volumes:
      - ./certs:/certs:ro
      - ./cas_revision.lua:/ci/cas_revision.lua:ro
    networks: [redis-ci]
  redis-replica:
    image: redis:7.4-alpine
    user: "0"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?CI REDIS_PASSWORD must be generated}
    command:
      - sh
      - -ec
      - |
        exec redis-server --port 0 --tls-port 6379 --tls-cert-file /certs/server.crt --tls-key-file /certs/server.key --tls-ca-cert-file /certs/ca.crt --tls-auth-clients no --tls-replication yes --requirepass "$$REDIS_PASSWORD" --masterauth "$$REDIS_PASSWORD" --replicaof redis-primary 6379
    volumes:
      - ./certs:/certs:ro
    depends_on: [redis-primary]
    networks: [redis-ci]
  sentinel-a: &sentinel
    image: redis:7.4-alpine
    user: "0"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?CI REDIS_PASSWORD must be generated}
    command:
      - sh
      - -ec
      - |
        cat >/tmp/sentinel.conf <<EOF
        port 0
        tls-port 26379
        tls-cert-file /certs/server.crt
        tls-key-file /certs/server.key
        tls-ca-cert-file /certs/ca.crt
        tls-auth-clients no
        tls-replication yes
        sentinel resolve-hostnames yes
        sentinel announce-hostnames yes
        sentinel monitor ci-master redis-primary 6379 2
        sentinel auth-pass ci-master $$REDIS_PASSWORD
        sentinel down-after-milliseconds ci-master 1500
        sentinel failover-timeout ci-master 15000
        sentinel parallel-syncs ci-master 1
        EOF
        exec redis-sentinel /tmp/sentinel.conf
    volumes:
      - ./certs:/certs:ro
    depends_on: [redis-primary, redis-replica]
    networks: [redis-ci]
  sentinel-b: *sentinel
  sentinel-c: *sentinel
networks:
  redis-ci:
    internal: true
