name: yarp-01-ci
services:
  backend-a:
    image: python:3.12-alpine
    command: ["python", "-u", "/lab/backend.py", "A"]
    volumes:
      - ./backend.py:/lab/backend.py:ro
    networks: [lab]
  backend-b:
    image: python:3.12-alpine
    command: ["python", "-u", "/lab/backend.py", "B"]
    volumes:
      - ./backend.py:/lab/backend.py:ro
    networks: [lab]
  gateway-a:
    image: yarp-ci-controlcenter:0.1
    build:
      context: ../../..
      dockerfile: tests/CI/stack/Dockerfile.gateway
    volumes:
      - state_a:/state
    depends_on: [backend-a, backend-b]
    networks: [lab]
  gateway-b:
    image: yarp-ci-controlcenter:0.1
    build:
      context: ../../..
      dockerfile: tests/CI/stack/Dockerfile.gateway
    volumes:
      - state_b:/state
    depends_on: [backend-a, backend-b]
    networks: [lab]
  ingress-a:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:18080:8080"
      - "127.0.0.1:18443:8443"
    volumes:
      - ./ingress.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/labcert:ro
    depends_on: [gateway-a, gateway-b]
    networks: [lab, hostaccess]
  ingress-b:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:18081:8080"
      - "127.0.0.1:18444:8443"
    volumes:
      - ./ingress.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/labcert:ro
    depends_on: [gateway-a, gateway-b]
    networks: [lab, hostaccess]
  prom-a:
    image: prom/prometheus:v3.6.0
    network_mode: "service:gateway-a"
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--web.listen-address=:9090"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on: [gateway-a]
  prom-b:
    image: prom/prometheus:v3.6.0
    network_mode: "service:gateway-b"
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--web.listen-address=:9090"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on: [gateway-b]
  grafana:
    image: grafana/grafana:11.6.1
    environment:
      GF_SECURITY_ADMIN_USER: "ci_operator"
      GF_SECURITY_ADMIN_PASSWORD: "CI_ONLY_NOT_PRODUCTION_01"
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:13000:3000"
    volumes:
      - ./grafana/datasources.yml:/etc/grafana/provisioning/datasources/ci.yml:ro
      - ./grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/ci.yml:ro
      - ./grafana/dashboard.json:/var/lib/grafana/dashboards/ci.json:ro
    depends_on: [prom-a, prom-b]
    networks: [lab, hostaccess]
volumes:
  state_a: {}
  state_b: {}
networks:
  lab:
    internal: true
  hostaccess: {}
