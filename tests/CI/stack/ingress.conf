worker_processes 1;
events { worker_connections 2048; }
http {
  upstream yarp {
    server gateway-a:8080 max_fails=1 fail_timeout=2s;
    server gateway-b:8080 max_fails=1 fail_timeout=2s;
    keepalive 16;
  }
  server {
    listen 8080;
    server_name _;
    location / {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
      proxy_connect_timeout 200ms;
      proxy_read_timeout 8s;
      proxy_next_upstream off;
      proxy_pass http://yarp;
      add_header X-Lab-Ingress $hostname always;
    }
  }
  server {
    listen 8443 ssl;
    server_name _;
    ssl_certificate /etc/labcert/server.crt;
    ssl_certificate_key /etc/labcert/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
      proxy_connect_timeout 200ms;
      proxy_read_timeout 8s;
      proxy_next_upstream off;
      proxy_pass http://yarp;
      add_header X-Lab-Ingress $hostname always;
    }
  }
}
