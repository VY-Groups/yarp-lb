<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GatewayCore License Authority</title><link rel="stylesheet" href="/portal.css"><script src="/portal.js" defer></script></head><body>
<header><h1>GatewayCore License Authority</h1><p>Company-only operations · Offline request approval</p><p id="identity"></p></header>
<main><p id="message" role="alert"></p>
<section id="requester" hidden><h2>Customer and subscription records</h2><form id="customer"><label>Customer ID<input name="id" required maxlength="80"></label><label>Organization name<input name="name" required maxlength="200"></label><button>Create customer</button></form>
<form id="subscription"><label>License ID<input name="licenseId" required maxlength="80"></label><label>Customer ID<input name="customerId" required maxlength="80"></label><label>Deployment ID<input name="deploymentId" required maxlength="80"></label><label>Edition<select name="edition"><option>evaluation</option><option>standard</option><option>professional</option><option>enterprise</option><option>custom</option></select></label><label>Nodes<input type="number" min="1" max="10000" name="maxNodes" required></label><label>Sites<input type="number" min="1" max="10000" name="maxSites" required></label><label>Expiry (UTC date)<input type="date" name="expiry" required></label><label>Features (comma-separated IDs)<input name="features" value="l7,tls,monitoring" required></label><button name="action" value="create">Create subscription</button><button name="action" value="renew">Request terms renewal</button></form>
<h2>Submit issuance or revocation</h2><form id="issue"><label>Subscription ID<input name="subscriptionId" required></label><label>Site ID<input name="siteId" required></label><label>Signed activation request<input type="file" name="request" accept=".gcr" required></label><button>Request issuance</button></form>
<form id="revoke"><label>Subscription ID<input name="subscriptionId" required></label><label>Allocation ID<input name="allocationId" required></label><button>Request revocation</button></form></section>
<section><h2>Customers</h2><div id="customers"></div><h2>Subscriptions</h2><div id="subscriptions"></div><h2>Approval queue</h2><div id="jobs"></div></section></main></body></html>
